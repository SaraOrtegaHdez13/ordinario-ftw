<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Favoritas — Clonspotify</title>

  <link rel="stylesheet" href="css/styles.css" />

</head>
<body>

  <nav>

    <div class="nav-brand">
      <img src="resources/Logo.png" class="brand-logo" />
      <span class="brand-name">Clonspotify</span>
    </div>

    <button class="nav-toggle" id="nav-toggle">☰</button>

    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">        <img src="resources/home.svg"        class="nav-icon"> Inicio</a></li>
      <li><a href="catalogo.html">     <img src="resources/music.svg"       class="nav-icon"> Catálogo</a></li>
      <li><a href="favoritas.html">    <img src="resources/heart.svg"       class="nav-icon"> Favoritas</a></li>
      <li><a href="playlists.html">    <img src="resources/playlist.svg"    class="nav-icon"> Playlists</a></li>
      <li><a href="estadisticas.html"> <img src="resources/chart-bar.svg"   class="nav-icon"> Estadísticas</a></li>
      <li><a href="agregar.html">      <img src="resources/square-plus.svg" class="nav-icon"> Agregar</a></li>
    </ul>

  </nav>

  <div class="page-header">
    <h1>Canciones <span class="accent">favoritas</span></h1>
    <p class="subtitle">Tu selección personal de lo mejor de la biblioteca</p>
  </div>

  <!-- FILTROS -->
  <section>
    <div class="filter-bar">
      <input type="search" id="buscar-fav"
             placeholder="Buscar favorita…"
             autocomplete="off" />

      <select id="filtro-fav-genero">
        <option value="">Todos los géneros</option>
      </select>

      <select id="filtro-fav-estrellas">
        <option value="">Cualquier calificación</option>
        <option value="5">★★★★★ 5 estrellas</option>
        <option value="4">★★★★☆ 4+</option>
        <option value="3">★★★☆☆ 3+</option>
      </select>

      <select id="vista-fav">
        <option value="cards">Vista tarjetas</option>
        <option value="lista">Vista lista</option>
      </select>

      <span class="results-count" id="fav-count">0 favoritas</span>
    </div>
  </section>

  <!-- CONTENEDOR DE FAVORITAS -->
  <section>
    <div id="contenedor-favoritas"></div>
  </section>

  <!-- Pie de página -->
  <footer>
    <p>Clonspotify © 2026</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/favoritas.js"></script>
</body>
</html>

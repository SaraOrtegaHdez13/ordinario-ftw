<!DOCTYPE html>
<html lang="es">

<head>

  <!-- Como vimos en clase, es para los caracteres-->
  <meta charset="UTF-8" />
  <!-- Para que se adapte a vista de dispositivos móviles-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login — Clonspotify</title>

  <link rel="stylesheet" href="css/styles.css" />
  
</head>

<body>

  <!-- Barra de navegación -->
  <nav>

    <!-- Logo y nombre -->
      <div class="nav-brand">
        <img src="resources/Logo.png" class="brand-logo" />
        <span class="brand-name">Clonspotify</span>
      </div>
    
    <!-- Menú hamburguesa, para cuando hagamos pequeña la vista de la página
     Funciona con los "nav-links" que declaramos más abajo-->
    <button class="nav-toggle" id="nav-toggle">☰</button>

    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">        <img src="resources/home.svg" class="nav-icon"> Inicio </a></li>
      <li><a href="catalogo.html">     <img src="resources/music.svg" class="nav-icon"> Catálogo</a></li>
      <li><a href="favoritas.html">    <img src="resources/heart.svg" class="nav-icon"> Favoritas</a></li>
      <li><a href="playlists.html">    <img src="resources/playlist.svg" class="nav-icon"> Playlists</a></li>
      <li><a href="estadisticas.html"> <img src="resources/chart-bar.svg" class="nav-icon"> Estadísticas</a></li>
      <li><a href="agregar.html">      <img src="resources/square-plus.svg" class="nav-icon"> Agregar</a></li>
    </ul>

  </nav>

    <header class="page-header" style="text-align:center">
      <h1>Acceso <span class="accent">administrativo</span></h1>
      <p class="subtitle">Ingresa tus credenciales para continuar</p>
    </header>

    <!-- Alertas -->

    <!-- Acceso incorrecto-->
    <div class="alert alert-error" id="alert-err">
      <img src="resources/alert-triangle.svg" class="alert-icon">
      <span id="alert-err-msg">Usuario o contraseña incorrectos.</span>
    </div>
    
    <!-- Sección general del login-->
    <section class="login-section">

      <div class="login-avatar">
        <img src="resources/user-circle.svg">
      </div>

      <div class="form-card">
        
        <!-- Todo lo que va dentro del card del login-->
        <form id="form-login" novalidate>

          <!-- Para ingresar el usuario dentro del login-->
          <div class="form-group">

            <!-- el FOR "usuario" sirve para que, si damos clic sobre ese texto, el cursos se vaya a la caja que le corresponde
             para ingresar el usuario-->
            <label class="form-label" for="usuario">
              Usuario <span class="required">*</span>
            </label>

            <input class="form-input" type="text" id="usuario" placeholder="ej: admin_Nombre"/> 
            <span class="form-error" id="usuario-err" >El usuario es obligatorio.</span>

          </div>

          <!-- Para ingresar la contraseña dentro del login-->
          <div class="form-group">

            <label class="form-label" for="password">
              Contraseña <span class="required">*</span>
            </label>

            <input class="form-input" type="password" id="password" placeholder="******"/>
            <span class="form-error" id="password-err">La contraseña es obligatoria.</span>
          </div>

          <!-- Para el botón de "Ingresar" en el formulario-->
          <div class="form-actions">
            <!-- type="submit" es para al hacer click, con el JS se dispare el evento del click-->
            <button type="submit" class="btn btn-primary" id="btn-ingresar" >
              Ingresar
            </button>
          </div>

        </form>
      </div>
    </section>

  <!-- Pie de página -->
  <footer>
    <p>Clonspotify © 2026</p>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
